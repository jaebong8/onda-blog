name: Monthly Gov Subsidy Cron

on:
  schedule:
    - cron: "0 6 1 * *" # 매월 1일 06:00 UTC (15:00 KST)
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call gov-subsidy cron endpoint
        run: |
          status=$(curl -s -o response.json -w "%{http_code}" -X GET "${{ secrets.SITE_URL }}/api/cron/gov-subsidy?dry=true" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          echo "HTTP status: $status"
          cat response.json
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            exit 1
          fi
