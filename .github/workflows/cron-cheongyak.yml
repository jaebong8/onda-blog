name: Weekly Cheongyak Cron

on:
  schedule:
    - cron: "0 1 * * 1" # 매주 월요일 01:00 UTC (10:00 KST)
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call cheongyak cron endpoint
        run: |
          status=$(curl -s -o response.json -w "%{http_code}" -X GET "${{ secrets.SITE_URL }}/api/cron/cheongyak" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          echo "HTTP status: $status"
          cat response.json
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            exit 1
          fi
